<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorneosArg - Partidos de equipos argentinos </title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <h1>Torneos<span>Arg</span></h1>
            </div>
            <button id="refresh-btn" class="refreshbtn">
                <span class="refresh-icon"></span>Actualizar
            </button>
        </header>

        <div id="alert-box" class="alert" style="display:none;"></div>

        <div class="controls-bar">
            <div class="league-selector">
                <label for="league-select">Liga:</label>
                <select name="" id="league-filter" class="league-select">
                    
                    <option value="ALL">Todas las ligas</option>
                    <option value="CL">UEFA Champions League</option>
                    <option value="ALL">Torneo argentino</option>
                    <option value="ALL">Copa Libertadores</option>
                    <option value="ALL">Copa Sudamericana</option>
                    <option value="ALL">Copa Argentina</option>
                </select>
            </div>

             <div class="tabs-container">
                <button class="tab-btn active" data-category="all">Todos <span id="count-all">(0)</span></button>
                <button class="tab-btn" data-category="live">Vivo <span id="count-live">(0)</span></button>

                <button class="tab-btn" data-category="finished">Terminados <span id="count-finished">(0)</span></button>
                <button class="tab-btn" data-category="upcoming">Próximos <span id="count-upcoming">(0)</span></button>
            </div>
        </div>

        <div id="matches-grid" class="matches-grid">
            <div id="status-msg" class="no-matches-msg">Cargando jugados...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
